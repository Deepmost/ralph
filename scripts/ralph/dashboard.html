<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ralph Dashboard</title>
<style>
:root{
  --bg:#070b16; --panel:rgba(17,27,46,0.72); --panel-brd:rgba(56,189,248,0.18);
  --cyan:#22d3ee; --blue:#38bdf8; --indigo:#818cf8; --txt:#e2e8f0; --muted:#64748b;
  --green:#4ade80; --amber:#fbbf24; --red:#f87171; --purple:#c084fc;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--txt); background:var(--bg); overflow:hidden;
  background-image:
    radial-gradient(900px 500px at 80% -10%, rgba(56,189,248,0.10), transparent 60%),
    radial-gradient(700px 500px at 0% 110%, rgba(129,140,248,0.10), transparent 60%),
    linear-gradient(rgba(56,189,248,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56,189,248,0.04) 1px, transparent 1px);
  background-size:100% 100%, 100% 100%, 40px 40px, 40px 40px;
}
.mono{font-family:'JetBrains Mono','Consolas','SF Mono',monospace;font-variant-numeric:tabular-nums;}
.glow{box-shadow:0 0 0 1px var(--panel-brd), 0 8px 40px -12px rgba(34,211,238,0.25);}
/* ── 布局 ── */
.app{display:grid;grid-template-rows:auto auto 1fr auto;gap:18px;height:100vh;padding:20px 26px;}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.work-row{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;min-height:0;}
/* ── 顶栏 ── */
.header{display:flex;justify-content:space-between;align-items:center;}
.brand{display:flex;align-items:center;gap:14px;}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:beat 1.6s infinite;}
.brand h1{font-size:1.55rem;font-weight:800;letter-spacing:0.04em;
  background:linear-gradient(90deg,var(--blue),var(--indigo));-webkit-background-clip:text;background-clip:text;color:transparent;}
.brand .tag{font-size:0.7rem;color:var(--muted);letter-spacing:0.25em;text-transform:uppercase;}
.head-right{display:flex;align-items:center;gap:20px;}
.clock{font-size:1.05rem;color:#cbd5e1;}
.uptime{text-align:right;}
.uptime .v{font-size:1.05rem;color:var(--cyan);}
.uptime .l{font-size:0.62rem;color:var(--muted);letter-spacing:0.2em;text-transform:uppercase;}
.status-badge{padding:7px 16px;border-radius:999px;font-size:0.78rem;font-weight:700;letter-spacing:0.08em;
  display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;}
.status-badge::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;}
.status-idle{background:#1e293b;color:#94a3b8;border-color:#334155;}
.status-developing{background:rgba(22,78,99,0.5);color:var(--cyan);border-color:rgba(34,211,238,0.4);animation:pulse 2s infinite;}
.status-validating{background:rgba(66,32,6,0.5);color:var(--amber);border-color:rgba(251,191,36,0.4);animation:pulse 2s infinite;}
.status-planning{background:rgba(59,7,100,0.5);color:var(--purple);border-color:rgba(192,132,252,0.4);animation:pulse 2s infinite;}
.status-done{background:rgba(20,83,45,0.5);color:var(--green);border-color:rgba(74,222,128,0.4);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.55;}}
@keyframes beat{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.4);opacity:0.6;}}
/* ── KPI 卡片 ── */
.card{background:var(--panel);border:1px solid var(--panel-brd);border-radius:16px;padding:18px 20px;
  backdrop-filter:blur(8px);position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:0.5;}
.card h3{font-size:0.7rem;color:var(--muted);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:14px;font-weight:600;}
.kpi{display:flex;align-items:center;gap:18px;}
/* 环形仪表 (纯 CSS conic-gradient) */
.ring{width:84px;height:84px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  background:conic-gradient(var(--ring-c,var(--cyan)) calc(var(--p,0)*1%), rgba(148,163,184,0.12) 0);
  transition:--p 0.6s ease; position:relative;}
.ring::after{content:'';position:absolute;inset:8px;border-radius:50%;background:#0b1322;
  box-shadow:inset 0 0 12px rgba(0,0,0,0.6);}
.ring .pct{position:relative;z-index:1;font-size:1.05rem;font-weight:700;color:#f1f5f9;}
.kpi-meta .big{font-size:1.9rem;font-weight:800;color:#f1f5f9;line-height:1;}
.kpi-meta .small{font-size:0.74rem;color:var(--muted);margin-top:6px;}
/* 阶段流程指示 */
.flow{display:flex;flex-direction:column;gap:9px;width:100%;}
.flow .step{display:flex;align-items:center;gap:10px;font-size:0.8rem;color:var(--muted);transition:color 0.3s;}
.flow .step .ico{width:9px;height:9px;border-radius:50%;background:#334155;transition:all 0.3s;}
.flow .step.active{color:#f1f5f9;font-weight:600;}
.flow .step.active .ico{background:var(--cyan);box-shadow:0 0 10px var(--cyan);}
.flow .step.passed .ico{background:var(--green);}
/* 分布统计 */
.dist{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;}
.dist .it{display:flex;align-items:center;gap:8px;}
.dist .it .sw{width:8px;height:8px;border-radius:2px;}
.dist .it .n{font-size:1.15rem;font-weight:700;}
.dist .it .lbl{font-size:0.72rem;color:var(--muted);}
/* ── 工作区 ── */
.panel{background:var(--panel);border:1px solid var(--panel-brd);border-radius:16px;padding:18px 20px;
  backdrop-filter:blur(8px);display:flex;flex-direction:column;min-height:0;}
.panel-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.panel-h h3{font-size:0.72rem;color:var(--muted);letter-spacing:0.14em;text-transform:uppercase;font-weight:600;}
.panel-h .cnt{font-size:0.72rem;color:var(--cyan);}
/* 当前任务焦点卡 */
.focus{display:flex;flex-direction:column;justify-content:center;flex:1;gap:14px;}
.focus .ftitle{font-size:1.5rem;font-weight:700;color:#f1f5f9;line-height:1.3;}
.focus .fid{display:inline-block;font-size:0.8rem;color:var(--cyan);background:rgba(34,211,238,0.1);
  padding:3px 10px;border-radius:6px;border:1px solid rgba(34,211,238,0.25);}
.focus .frow{display:flex;gap:24px;flex-wrap:wrap;}
.focus .frow .k{font-size:0.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;}
.focus .frow .vv{font-size:0.92rem;color:#cbd5e1;margin-top:3px;}
.focus .notes{font-size:0.82rem;color:var(--amber);background:rgba(251,191,36,0.08);
  border-left:3px solid var(--amber);padding:8px 12px;border-radius:4px;}
.focus.empty{align-items:center;justify-content:center;color:var(--muted);}
/* 任务队列 */
.qlist{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:6px;padding-right:4px;}
.qlist::-webkit-scrollbar{width:6px;}
.qlist::-webkit-scrollbar-thumb{background:#334155;border-radius:3px;}
.qrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;
  background:rgba(15,23,42,0.5);border:1px solid transparent;transition:all 0.25s;}
.qrow.running{border-color:rgba(34,211,238,0.4);background:rgba(22,78,99,0.25);}
.qrow .qi{width:18px;text-align:center;font-size:0.9rem;}
.qrow .qid{font-size:0.74rem;color:var(--muted);width:30px;}
.qrow .qt{flex:1;font-size:0.88rem;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qrow.running .qt{color:#f1f5f9;}
.qrow .qbadge{font-size:0.66rem;padding:2px 7px;border-radius:5px;}
.qrow .qretry{font-size:0.64rem;color:var(--amber);background:rgba(251,191,36,0.12);padding:2px 6px;border-radius:5px;}
/* ── 日志流 ── */
.logbox{background:rgba(2,6,16,0.75);border:1px solid var(--panel-brd);border-radius:16px;
  padding:14px 18px;display:flex;flex-direction:column;min-height:0;}
.logbox .lh{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.logbox .lh .dots{display:flex;gap:6px;}
.logbox .lh .dots i{width:9px;height:9px;border-radius:50%;display:inline-block;}
.logbox .lh span{font-size:0.7rem;color:var(--muted);letter-spacing:0.1em;}
#logs{font-family:'JetBrains Mono','Consolas',monospace;font-size:0.76rem;color:#7dd3fc;
  white-space:pre-wrap;overflow-y:auto;flex:1;line-height:1.55;}
#logs::-webkit-scrollbar{width:6px;}
#logs::-webkit-scrollbar-thumb{background:#334155;border-radius:3px;}
.empty-q{color:var(--muted);font-size:0.85rem;text-align:center;padding:30px;}
@property --p{syntax:'<number>';initial-value:0;inherits:false;}
</style>
</head>
<body>
<div class="app">
  <!-- 顶栏 -->
  <header class="header">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>RALPH DASHBOARD</h1>
        <div class="tag">Autonomous Agent Orchestrator</div>
      </div>
    </div>
    <div class="head-right">
      <div class="clock mono" id="clock">--:--:--</div>
      <div class="uptime">
        <div class="v mono" id="elapsed">0:00</div>
        <div class="l">运行时长</div>
      </div>
      <span class="status-badge status-idle" id="phase-badge">IDLE</span>
    </div>
  </header>

  <!-- KPI 区 -->
  <section class="kpi-row">
    <div class="card glow">
      <h3>迭代进度</h3>
      <div class="kpi">
        <div class="ring" id="iter-ring" style="--ring-c:var(--blue);"><span class="pct mono" id="iter-pct">0%</span></div>
        <div class="kpi-meta">
          <div class="big mono" id="iteration">0 / 0</div>
          <div class="small">当前迭代轮次</div>
        </div>
      </div>
    </div>
    <div class="card glow">
      <h3>任务完成率</h3>
      <div class="kpi">
        <div class="ring" id="task-ring" style="--ring-c:var(--green);"><span class="pct mono" id="task-pct">0%</span></div>
        <div class="kpi-meta">
          <div class="big mono" id="task-stats">0 / 0</div>
          <div class="small" id="task-sub">已完成 / 总任务</div>
        </div>
      </div>
    </div>
    <div class="card glow">
      <h3>执行阶段</h3>
      <div class="flow" id="flow">
        <div class="step" data-ph="developing"><span class="ico"></span>开发中 · Develop</div>
        <div class="step" data-ph="validating"><span class="ico"></span>验证中 · Validate</div>
        <div class="step" data-ph="planning"><span class="ico"></span>规划中 · Plan</div>
      </div>
    </div>
    <div class="card glow">
      <h3>任务分布</h3>
      <div class="dist">
        <div class="it"><span class="sw" style="background:var(--green)"></span><span class="n mono" id="d-done">0</span><span class="lbl">完成</span></div>
        <div class="it"><span class="sw" style="background:var(--cyan)"></span><span class="n mono" id="d-run">0</span><span class="lbl">进行</span></div>
        <div class="it"><span class="sw" style="background:var(--muted)"></span><span class="n mono" id="d-pend">0</span><span class="lbl">待办</span></div>
        <div class="it"><span class="sw" style="background:var(--red)"></span><span class="n mono" id="d-block">0</span><span class="lbl">阻塞</span></div>
      </div>
    </div>
  </section>

  <!-- 工作区 -->
  <section class="work-row">
    <div class="panel">
      <div class="panel-h"><h3>当前焦点任务</h3><span class="cnt" id="focus-file"></span></div>
      <div class="focus empty" id="focus"><div>暂无执行中的任务</div></div>
    </div>
    <div class="panel">
      <div class="panel-h"><h3>任务队列</h3><span class="cnt" id="queue-cnt">0 项</span></div>
      <div class="qlist" id="task-list"></div>
    </div>
  </section>

  <!-- 日志 -->
  <div class="logbox" style="max-height:200px;">
    <div class="lh"><div class="dots"><i style="background:#f87171"></i><i style="background:#fbbf24"></i><i style="background:#4ade80"></i></div><span>实时日志 · progress.log</span></div>
    <pre id="logs"></pre>
  </div>
</div>
<!-- SCRIPT -->
<script>
const POLL_MS = 2000;
// phase → { 文案, 样式类 }，覆盖 ralph.py 实际写入的全部阶段
const phaseMap = {
  idle:       { label:'IDLE',     cls:'status-idle' },
  developing: { label:'开发中',    cls:'status-developing' },
  validating: { label:'验证中',    cls:'status-validating' },
  planning:   { label:'PM 规划中', cls:'status-planning' },
  done:       { label:'DONE',     cls:'status-done' },
};
// 阶段流程顺序，用于点亮「已完成/进行中」步骤
const flowOrder = ['developing','validating','planning'];
const statusColor = { pending:'#64748b', running:'#22d3ee', done:'#4ade80', failed:'#f87171', blocked:'#f87171' };
const statusIcon  = { pending:'&#9679;', running:'&#9654;', done:'&#10003;', failed:'&#10007;', blocked:'&#9888;' };

const fmt = s => { const m = Math.floor(s/60); return `${m}:${String(Math.floor(s%60)).padStart(2,'0')}`; };
const $ = id => document.getElementById(id);

function tickClock(){ $('clock').textContent = new Date().toLocaleTimeString('zh-CN',{hour12:false}); }
setInterval(tickClock, 1000); tickClock();

function setRing(ring, pctEl, pct){
  ring.style.setProperty('--p', pct);
  pctEl.textContent = Math.round(pct) + '%';
}

function render(d){
  const r = d.runtime || {};
  const tasks = d.tasks || [];

  // 状态徽章
  const ph = phaseMap[r.phase] || phaseMap.idle;
  const badge = $('phase-badge');
  badge.textContent = ph.label;
  badge.className = 'status-badge ' + ph.cls;

  // 迭代进度环
  const iterPct = r.max_iterations ? (r.iteration / r.max_iterations * 100) : 0;
  $('iteration').textContent = `${r.iteration||0} / ${r.max_iterations||0}`;
  setRing($('iter-ring'), $('iter-pct'), iterPct);

  // 任务完成率环（done 在 tasks 中已含归档任务）
  const done    = tasks.filter(t => t.status==='done').length;
  const failed  = tasks.filter(t => t.status==='failed').length;
  const pending = tasks.filter(t => t.status==='pending').length;
  const blocked = tasks.filter(t => t.status==='blocked').length;
  const cur = tasks.find(t => t.id === String(r.current_task));
  const running = (cur && cur.status!=='done') ? 1 : 0;
  const taskPct = tasks.length ? (done / tasks.length * 100) : 0;
  $('task-stats').textContent = `${done} / ${tasks.length}`;
  $('task-sub').textContent = failed ? `${failed} 个失败` : '已完成 / 总任务';
  setRing($('task-ring'), $('task-pct'), taskPct);

  // 阶段流程指示
  const idx = flowOrder.indexOf(r.phase);
  document.querySelectorAll('#flow .step').forEach((el,i)=>{
    el.classList.toggle('active', i===idx);
    el.classList.toggle('passed', idx>=0 && i<idx);
  });

  // 任务分布
  $('d-done').textContent  = done;
  $('d-run').textContent   = running;
  $('d-pend').textContent  = pending;
  $('d-block').textContent = blocked + failed;

  // 运行时长
  $('elapsed').textContent = fmt(r.elapsed||0);

  // 当前焦点任务
  const focus = $('focus');
  if (cur) {
    focus.className = 'focus';
    $('focus-file').textContent = cur.file || '';
    focus.innerHTML = `
      <span class="fid">#${cur.id}</span>
      <div class="ftitle">${cur.title||'-'}</div>
      <div class="frow">
        <div><div class="k">状态</div><div class="vv" style="color:${statusColor[cur.status]||'#cbd5e1'}">${cur.status}</div></div>
        <div><div class="k">优先级</div><div class="vv">${cur.priority ?? '-'}</div></div>
        <div><div class="k">重试次数</div><div class="vv">${cur.retryCount||0}</div></div>
      </div>
      ${cur.notes ? `<div class="notes">${cur.notes}</div>` : ''}`;
  } else {
    focus.className = 'focus empty';
    $('focus-file').textContent = '';
    focus.innerHTML = '<div>暂无执行中的任务</div>';
  }

  // 任务队列
  $('queue-cnt').textContent = `${tasks.length} 项`;
  const list = $('task-list');
  if (!tasks.length) {
    list.innerHTML = '<div class="empty-q">队列为空，等待任务注入…</div>';
  } else {
    list.innerHTML = tasks.map(t => {
      const isRun = cur && t.id===cur.id && cur.status!=='done';
      const st = isRun ? 'running' : t.status;
      const c = statusColor[st] || '#64748b';
      return `<div class="qrow ${isRun?'running':''}">
        <span class="qi" style="color:${c}">${statusIcon[st]||'&#9679;'}</span>
        <span class="qid mono">#${t.id}</span>
        <span class="qt">${t.title}</span>
        ${t.retryCount ? `<span class="qretry">&#8635; ${t.retryCount}</span>` : ''}
        <span class="qbadge" style="color:${c};background:${c}22">${st}</span>
      </div>`;
    }).join('');
  }

  // 日志（自动滚到底部）
  const lg = $('logs');
  const atBottom = lg.scrollHeight - lg.scrollTop - lg.clientHeight < 40;
  lg.textContent = d.logs || '';
  if (atBottom) lg.scrollTop = lg.scrollHeight;
}

async function poll(){
  try { const res = await fetch('/api/state'); if (res.ok) render(await res.json()); }
  catch(e){}
  setTimeout(poll, POLL_MS);
}
poll();
</script>

</body>
</html>
